<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#ffffff">
<title>La Royale · Document confidentiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* Rapport de conseil, pensé d'abord pour le téléphone : une colonne de lecture, barre de navigation fixe,
   sommaire en panneau, leviers dépliables. Thème clair uniquement, comme un document imprimé. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --soft: #f5f7fa;
  --ink: #0d1b2e;
  --muted: #5b6578;
  --line: #e2e6ec;
  --accent: #1d4f91;
  --accent-soft: #eaf0f8;
  --gain: #1d7a4b;
  --gain-soft: #e8f4ee;
  --amber: #7a5200;
  --amber-soft: #fbf2df;

  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;

  --gutter: max(20px, env(safe-area-inset-left, 0px));
  --gutter-r: max(20px, env(safe-area-inset-right, 0px));
  --bar-h: 52px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1.0625rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: var(--serif); font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
h3 { font-size: 1.0625rem; font-weight: 600; line-height: 1.35; text-wrap: balance; }
ul, ol { margin: 0; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.arrow-link { font-size: .9375rem; font-weight: 500; color: var(--accent); text-decoration: none; }
.arrow-link::after { content: " →"; }

/* ---------- Écran d'accès ---------- */
.gate {
  min-height: 100vh; min-height: 100dvh;
  display: grid; place-items: center;
  padding: 32px var(--gutter-r) 32px var(--gutter);
  background: var(--soft);
}
.gate-card { width: 100%; max-width: 400px; display: grid; gap: 24px; }
.gate-mark { display: grid; gap: 4px; }
.gate-mark .label { color: var(--accent); }
.gate-title { font-family: var(--serif); font-size: 1.75rem; font-weight: 600; line-height: 1.2; }
.gate-sub { color: var(--muted); font-size: .9375rem; }
.gate-form { display: grid; gap: 12px; padding: 22px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.gate-form label { font-weight: 600; font-size: .9375rem; }
.gate-input {
  width: 100%; font: inherit; font-size: 1.6rem; font-weight: 600; letter-spacing: .5em; text-align: center; font-variant-numeric: tabular-nums;
  padding: 10px 14px 10px calc(14px + .5em); border: 1px solid #c9d0da; border-radius: 4px; background: #fff; color: var(--ink);
}
.gate-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.gate-btn {
  font: inherit; font-weight: 600; font-size: 1rem;
  padding: 13px 16px; border: 0; border-radius: 4px; cursor: pointer;
  background: var(--ink); color: #fff;
}
.gate-btn:disabled { opacity: .6; cursor: progress; }
.gate-error { color: #a1261b; font-size: .875rem; min-height: 1.3em; }
.gate-foot { font-size: .8125rem; color: var(--muted); display: grid; gap: 4px; }

/* ---------- Barre fixe et sommaire ---------- */
body.unlocked::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 40; }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: rgba(255, 255, 255, .96);
  -webkit-backdrop-filter: saturate(1.4) blur(8px); backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--line);
}
.bar-in {
  max-width: 1080px; margin: 0 auto; height: var(--bar-h);
  padding-left: var(--gutter); padding-right: var(--gutter-r);
  display: flex; align-items: center; gap: 12px;
}
.bar-brand { display: grid; line-height: 1.15; text-decoration: none; min-width: 0; }
.bar-brand strong { font-size: .8125rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.bar-brand span { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-btn {
  margin-left: auto; flex: none;
  display: inline-flex; align-items: center; gap: 8px;
  font: inherit; font-size: .875rem; font-weight: 600;
  padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); cursor: pointer;
}
.bar-btn svg { width: 16px; height: 16px; }
.bar-progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--accent); }

.toc-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(13, 27, 46, .35); }
.toc {
  position: fixed; z-index: 60; inset: 0 0 0 auto; width: min(100%, 420px);
  background: var(--bg); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: -12px 0 32px rgba(13, 27, 46, .12);
}
.toc-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: var(--bar-h); padding: 0 var(--gutter-r) 0 var(--gutter); border-bottom: 1px solid var(--line); }
.toc-list { list-style: none; overflow-y: auto; padding: 8px 0 24px; }
.toc-list a {
  display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); gap: 8px; align-items: baseline;
  padding: 13px var(--gutter-r) 13px var(--gutter); text-decoration: none; border-bottom: 1px solid var(--line);
}
.toc-list a span:first-child { font-size: .8125rem; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
.toc-list a[aria-current="true"] { background: var(--accent-soft); }

/* ---------- Mise en page générale ---------- */
.page { max-width: 1080px; margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter-r); }
.sec { padding-block: 56px 8px; scroll-margin-top: calc(var(--bar-h) + 12px); display: grid; gap: 24px; }
.sec + .sec { border-top: 1px solid var(--line); margin-top: 48px; }
.sec-head { display: grid; gap: 10px; max-width: 44rem; }
.sec-num { font-size: .8125rem; font-weight: 600; letter-spacing: .08em; color: var(--accent); font-variant-numeric: tabular-nums; }
.sec-head h2 { font-size: clamp(1.6rem, 1.3rem + 1.4vw, 2.2rem); line-height: 1.18; }
.sec-lead { color: var(--muted); max-width: 62ch; }
.prose { display: grid; gap: 12px; max-width: 64ch; }
.source { font-size: .8125rem; color: var(--muted); }

.takeaway { display: grid; gap: 6px; padding: 16px 18px; background: var(--accent-soft); border-radius: 6px; max-width: 52rem; }
.takeaway .label { color: var(--accent); }
.takeaway p { font-weight: 500; }

/* ---------- Couverture ---------- */
.cover { padding-block: 36px 8px; display: grid; gap: 18px; scroll-margin-top: var(--bar-h); }
.cover-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
.cover-meta .label:first-child { color: var(--accent); }
.cover-client { color: var(--muted); font-size: .9375rem; }
.cover h1 { font-size: clamp(2rem, 1.5rem + 2.6vw, 3.1rem); line-height: 1.1; max-width: 18ch; }
.cover-sub { font-size: 1.1875rem; color: var(--muted); max-width: 40ch; }
.cover-facts { margin: 8px 0 0; display: grid; grid-template-columns: minmax(0, 1fr); border-top: 1px solid var(--line); }
.cover-facts > div { display: grid; gap: 2px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.cover-facts dt { font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.cover-facts dd { margin: 0; font-size: .9375rem; }

/* ---------- Synthèse ---------- */
.messages { list-style: none; display: grid; gap: 0; counter-reset: msg; border-top: 1px solid var(--line); }
.messages li { counter-increment: msg; display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 4px 12px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.messages li::before { content: counter(msg); grid-row: span 2; font-family: var(--serif); font-size: 1.5rem; font-weight: 600; line-height: 1.1; color: var(--accent); }
.messages h3 { font-family: var(--serif); font-size: 1.2rem; font-weight: 600; }
.messages p { color: var(--muted); font-size: .9375rem; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.kpi { padding: 16px; display: grid; gap: 2px; align-content: start; border-color: var(--line); border-style: solid; border-width: 0; }
.kpi:nth-child(odd) { border-right-width: 1px; }
.kpi:nth-child(-n+2) { border-bottom-width: 1px; }
.kpi-v { font-size: 1.9rem; font-weight: 600; line-height: 1.05; color: var(--accent); font-variant-numeric: tabular-nums; }
.kpi-l { font-size: .8125rem; color: var(--muted); line-height: 1.35; }

/* ---------- Méthode et parcours ---------- */
.principles { list-style: none; display: grid; counter-reset: pr; border-top: 1px solid var(--line); }
.principles li { counter-increment: pr; display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.principles li::before { content: counter(pr); font-weight: 600; color: var(--accent); }
.principles span { color: var(--muted); }
.path { --g: 14px; list-style: none; position: relative; display: grid; gap: var(--g); }
.path::before { content: ""; position: absolute; left: 15px; top: 16px; bottom: 16px; width: 2px; background: var(--line); }
.path-step { position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: start; }
.path-marker {
  position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; font-size: .875rem; font-weight: 600; color: var(--muted);
  background: var(--bg); border: 2px dashed #cdd3dc;
}
.path-step.is-current .path-marker { color: var(--accent); background: var(--accent-soft); border: 2px solid var(--accent); }
.path-card { display: grid; gap: 10px; padding: 16px 18px; border: 1px dashed #cdd3dc; border-radius: 6px; }
.path-step.is-current .path-card { border: 1px solid var(--accent); box-shadow: 0 8px 20px rgba(13, 27, 46, .06); }
.path-badge { justify-self: start; font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.path-step.is-current .path-badge { color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 3px; }
.path-card h3 { font-family: var(--serif); font-size: 1.2rem; }
.path-card dl, .kv { display: grid; gap: 8px; margin: 0; }
.path-card dt, .kv dt { font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.path-card dd, .kv dd { margin: 1px 0 0; font-size: .9375rem; }
.path-step:not(.is-current) .path-card dd { color: var(--muted); }

/* ---------- Profil ---------- */
.profile { border-top: 1px solid var(--line); }
.prow { display: grid; gap: 4px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.prow.head { display: none; }
.p-label { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.p-fact { font-weight: 500; }
.p-read { font-size: .9375rem; color: var(--muted); }

/* ---------- Leviers ---------- */
.levers { display: grid; gap: 10px; }
.lever-card { border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.lever-card summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 16px 18px; }
.lever-card summary::-webkit-details-marker { display: none; }
.lever-card summary h3 { font-size: 1.0625rem; }
.lever-meta { grid-column: 1; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .75rem; color: var(--muted); }
.chev { grid-column: 2; grid-row: 1 / span 2; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--soft); transition: transform .2s ease; }
.chev svg { width: 14px; height: 14px; }
.lever-card[open] .chev { transform: rotate(180deg); }
.lever-body { display: grid; gap: 10px; padding: 0 18px 18px; }
.lever-body > p { color: var(--muted); font-size: .9375rem; }
.lever-body ul { list-style: none; display: grid; gap: 9px; font-size: .9375rem; }
.lever-body li { position: relative; padding-left: 16px; }
.lever-body li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; background: var(--accent); }
.meter { display: inline-flex; align-items: center; gap: 6px; }
.dots { display: inline-flex; gap: 2px; }
.dots i { width: 12px; height: 4px; background: var(--line); }
.dots i.on { background: var(--accent); }

/* ---------- Fiscalité et aides ---------- */
.fisc-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.fisc-summary > div { padding: 14px; display: grid; gap: 2px; }
.fisc-summary > div + div { border-left: 1px solid var(--line); }
.fisc-summary strong { font-size: 1.6rem; font-weight: 600; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
.fisc-summary span { font-size: .78rem; color: var(--muted); line-height: 1.3; }
.teasers { display: grid; gap: 12px; }
.teaser { display: grid; gap: 10px; padding: 18px; border: 1px solid var(--line); border-radius: 6px; }
.teaser-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.teaser-cat { font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.chip { font-size: .72rem; font-weight: 600; padding: 3px 8px; border-radius: 3px; white-space: nowrap; }
.chip.prob { color: var(--gain); background: var(--gain-soft); }
.chip.check { color: var(--amber); background: var(--amber-soft); }
.teaser h3 { font-family: var(--serif); font-size: 1.15rem; }
.teaser > p { color: var(--muted); font-size: .9375rem; }
.teaser-stakes { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .8125rem; }
.teaser-stakes b { font-weight: 600; }
.locked { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px; background: var(--soft); border-radius: 4px; }
.locked svg { width: 16px; height: 16px; margin-top: 2px; color: var(--muted); }
.redact { display: grid; gap: 6px; }
.redact i { display: block; height: 9px; border-radius: 2px; background: #d9dee6; }
.redact i:nth-child(1) { width: 92%; } .redact i:nth-child(2) { width: 78%; } .redact i:nth-child(3) { width: 55%; }
.locked small { display: block; margin-top: 6px; font-size: .78rem; color: var(--muted); }

/* ---------- Estimation ---------- */
.sim { display: grid; gap: 20px; align-items: start; }
.controls { display: grid; gap: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 6px; }
.ca-box { display: grid; gap: 8px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.ca-value { font-size: 1.75rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.lever { display: grid; gap: 6px; }
.lever-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.lever-head label, .ca-box label { font-weight: 600; }
.lever-head output { font-weight: 600; font-size: .9375rem; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lever-note { font-size: .8125rem; color: var(--muted); line-height: 1.45; }
input[type="range"] { width: 100%; height: 28px; accent-color: var(--accent); margin: 2px 0; }
.btn { justify-self: start; font: inherit; font-size: .9375rem; padding: 9px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.sim-sticky {
  position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding: 12px 16px; margin: 0 -6px -6px; background: var(--ink); color: #fff;
  font-size: .9375rem; border-radius: 6px; box-shadow: 0 8px 24px rgba(13, 27, 46, .25);
}
.sim-sticky strong { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.summary { display: grid; gap: 4px; padding: 18px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); }
.s-rows { margin: 0; display: grid; }
.s-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .9375rem; }
.s-row dt { color: var(--muted); }
.s-row dd { margin: 0; font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
.s-row.strong dt, .s-row.strong dd { color: var(--ink); font-weight: 600; }
.s-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 0 12px; border-bottom: 2px solid var(--ink); }
.s-total span { font-weight: 600; }
.s-total strong { font-size: 1.6rem; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }

/* ---------- Valeur ---------- */
.criteria { list-style: none; display: grid; counter-reset: cr; border-top: 1px solid var(--line); }
.criteria li { counter-increment: cr; display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 4px 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.criteria li::before { content: counter(cr); grid-row: span 2; font-family: var(--serif); font-size: 1.3rem; font-weight: 600; line-height: 1.2; color: var(--accent); }
.criteria p { font-size: .9375rem; color: var(--muted); }
.table-scroll { overflow-x: auto; }
table.val { width: 100%; border-collapse: collapse; font-size: .9375rem; }
table.val th, table.val td { padding: 11px 0; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.val th:first-child, table.val td:first-child { text-align: left; }
table.val thead th { font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--ink); }
table.val td.big { font-weight: 600; color: var(--gain); }
.caption { font-size: .8125rem; color: var(--muted); margin-top: 8px; }

/* ---------- Déroulement ---------- */
.steps { list-style: none; display: grid; counter-reset: step; border-top: 1px solid var(--line); }
.step { counter-increment: step; display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 2px 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.step::before { content: counter(step); grid-row: span 3; font-family: var(--serif); font-size: 1.3rem; font-weight: 600; line-height: 1.2; color: var(--accent); }
.step-when { font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.step p { color: var(--muted); font-size: .9375rem; }
.horizon { display: grid; gap: 10px; }
.horizon > div { display: grid; gap: 6px; padding: 16px 18px; background: var(--soft); border-radius: 6px; }
.horizon ul { list-style: none; display: grid; gap: 4px; font-size: .9375rem; color: var(--muted); }

/* ---------- Données ---------- */
.coverage { display: grid; gap: 12px; padding: 18px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); }
.cov-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.cov-num { font-size: 1.1rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cov-num strong { font-size: 2rem; font-weight: 600; color: var(--accent); }
.cov-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.cov-bar { height: 8px; background: #dfe5ee; border-radius: 4px; overflow: hidden; }
.cov-bar span { display: block; height: 100%; width: 15.6%; background: var(--accent); transition: width .25s ease; }
.cov-note { font-size: .9375rem; color: var(--muted); }
.cov-domains { list-style: none; display: grid; gap: 2px 24px; font-size: .9375rem; border-top: 1px solid var(--line); padding-top: 8px; }
.cov-domains li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 4px 0; }
.pip-wrap { display: inline-flex; align-items: center; gap: 8px; flex: none; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 12px; height: 6px; border-radius: 1px; background: #d3dae4; }
.pips i.on { background: var(--accent); }
.pip-count { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2.2em; text-align: right; }
.tiers { display: grid; gap: 12px; }
.tier { display: grid; gap: 12px; padding: 18px; border: 1px solid var(--line); border-radius: 6px; }
.tier-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.tier-head h3 { font-family: var(--serif); font-size: 1.15rem; }
.tier ul { list-style: none; display: grid; gap: 4px; }
.doc { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 8px 0; font-size: .9375rem; line-height: 1.45; cursor: pointer; }
.doc input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); cursor: pointer; }
.doc input:checked + .doc-text { font-weight: 500; }
.unlock { display: block; color: var(--muted); font-size: .8125rem; margin-top: 2px; font-weight: 400; }
.privacy { display: grid; gap: 8px; padding: 18px; border: 1px solid var(--line); border-radius: 6px; }
.ticks { list-style: none; display: grid; gap: 6px; font-size: .9375rem; }
.ticks li { position: relative; padding-left: 16px; }
.ticks li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; background: var(--accent); }

/* ---------- Conditions, équipe, fin ---------- */
.deal { display: grid; border: 1px solid var(--line); border-radius: 6px; }
.deal > div { display: grid; gap: 4px; padding: 18px; }
.deal > div + div { border-top: 1px solid var(--line); }
.deal-v { font-family: var(--serif); font-size: 1.5rem; font-weight: 600; color: var(--accent); }
.deal p { font-size: .9375rem; color: var(--muted); }
.team { display: grid; gap: 0; border-top: 1px solid var(--line); }
.person { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 2px 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.avatar { grid-row: span 3; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: .9375rem; background: var(--accent-soft); color: var(--accent); }
.person-role { font-size: .8125rem; color: var(--accent); font-weight: 500; }
.person p { font-size: .9375rem; color: var(--muted); }
.closing { display: grid; gap: 14px; padding: 24px 20px; margin-top: 48px; border-radius: 6px; background: var(--ink); color: #fff; }
.closing .label { color: #b9c6da; }
.closing h2 { font-size: 1.6rem; color: #fff; }
.closing p { color: #dbe3ee; max-width: 60ch; }
.closing .sign { color: #fff; font-weight: 600; }
.annex { margin-block: 40px 24px; border-top: 1px solid var(--line); padding-top: 20px; display: grid; gap: 14px; font-size: .8125rem; color: var(--muted); }
.annex details summary { cursor: pointer; font-weight: 600; color: var(--ink); font-size: .9375rem; }
.annex ul { padding-left: 18px; display: grid; gap: 6px; margin-top: 10px; }
.annex a { color: var(--muted); word-break: break-word; }
.confid { font-size: .78rem; color: var(--muted); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }

/* ---------- Écrans plus larges ---------- */
@media (min-width: 720px) {
  .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpi { border-width: 0; }
  .kpi + .kpi { border-left-width: 1px; }
  .cover-facts { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 24px; }
  .teasers, .tiers, .horizon { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .deal { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .deal > div + div { border-top: 0; border-left: 1px solid var(--line); }
  .cov-domains { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .prow { grid-template-columns: 9rem minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: baseline; }
  .prow.head { display: grid; padding-block: 10px; }
  .prow.head span { font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .team { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 24px; border-top: 0; }
  .person { grid-template-columns: minmax(0, 1fr); border-top: 1px solid var(--line); }
  .avatar { grid-row: auto; margin-bottom: 6px; }
}
@media (min-width: 960px) {
  body { font-size: 1.0625rem; }
  .sec { padding-block: 72px 8px; }
  .levers { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .path { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .path::before { left: 16px; right: calc((100% - 2 * var(--g)) / 3 - 16px); top: 15px; bottom: auto; width: auto; height: 2px; }
  .path-step { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .teasers { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tiers, .horizon { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sim { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  .summary-holder { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 16px); }
  .sim-sticky { display: none; }
  .val-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
  .cov-domains { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  .chev, .cov-bar span { transition: none; }
}
@media print {
  .bar, .toc, .toc-backdrop, .btn, .sim-sticky, .cov-actions, input[type="range"], body::before { display: none !important; }
  .chev { display: none; }
  .sec { break-inside: auto; padding-block: 24px 0; }
  .lever-card, .teaser, .tier, .path-step, .criteria li, .prow, .step, .person, .summary { break-inside: avoid; }
  .closing { background: #fff; color: var(--ink); border: 1px solid var(--ink); }
  .closing h2, .closing p, .closing .sign { color: var(--ink); }
}
</style>
</head>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-mark">
      <span class="label">Document confidentiel</span>
      <p class="gate-title">La Royale</p>
      <p class="gate-sub">Étude préliminaire et proposition d'accompagnement · Octobre 2026</p>
    </div>
    <form class="gate-form" id="gate-form" autocomplete="off">
      <label for="gate-code">Code d'accès</label>
      <input class="gate-input" id="gate-code" name="code" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" required>
      <button class="gate-btn" id="gate-btn" type="submit">Ouvrir le document</button>
      <p class="gate-error" id="gate-error" role="alert"></p>
    </form>
    <div class="gate-foot">
      <span>Contenu chiffré, accessible avec le code transmis.</span>
      <span>Établi par Matthieu Jacques, avec Ophélie Deschaux et Nathan Smaniotto.</span>
    </div>
  </div>
</div>

<div id="app" hidden>

</div>

<script>
// Initialise le document une fois déchiffré : navigation, sommaire, leviers dépliables, estimation, documents.
function initApp() {
  var $ = function (id) { return document.getElementById(id); };
  var eur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
  var round = function (v) { return Math.round(v / 50) * 50; };

  // --- Sommaire et section courante
  var sections = Array.prototype.slice.call(document.querySelectorAll(".sec[data-title]"));
  var list = $("toc-list");
  sections.forEach(function (sec, i) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.href = "#" + sec.id;
    a.innerHTML = "<span>" + String(i + 1).padStart(2, "0") + "</span><span></span>";
    a.lastChild.textContent = sec.getAttribute("data-title");
    li.appendChild(a);
    list.appendChild(li);
  });
  var toc = $("toc"), backdrop = $("toc-backdrop"), openBtn = $("toc-open");
  function openToc() { toc.hidden = false; backdrop.hidden = false; openBtn.setAttribute("aria-expanded", "true"); var f = toc.querySelector("a[aria-current]") || toc.querySelector("a"); if (f) f.focus(); }
  function closeToc() { toc.hidden = true; backdrop.hidden = true; openBtn.setAttribute("aria-expanded", "false"); }
  openBtn.addEventListener("click", openToc);
  $("toc-close").addEventListener("click", function () { closeToc(); openBtn.focus(); });
  backdrop.addEventListener("click", closeToc);
  list.addEventListener("click", function (e) { if (e.target.closest("a")) closeToc(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !toc.hidden) { closeToc(); openBtn.focus(); } });

  var barSection = $("bar-section"), progress = $("bar-progress"), current = -1;
  var links = list.querySelectorAll("a");
  function onScroll() {
    var idx = -1;
    sections.forEach(function (sec, i) { if (sec.getBoundingClientRect().top <= 90) idx = i; });
    if (idx !== current) {
      current = idx;
      barSection.textContent = idx < 0 ? "Document confidentiel" : String(idx + 1).padStart(2, "0") + " · " + sections[idx].getAttribute("data-title");
      Array.prototype.forEach.call(links, function (a, i) { if (i === idx) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current"); });
    }
    var max = document.documentElement.scrollHeight - window.innerHeight;
    progress.style.width = (max > 0 ? Math.min(100, window.scrollY / max * 100) : 0) + "%";
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);
  onScroll();

  // --- Leviers : tout ouvert sur grand écran, premier ouvert sur téléphone
  var cards = Array.prototype.slice.call(document.querySelectorAll(".lever-card"));
  if (window.matchMedia("(min-width: 960px)").matches) cards.forEach(function (c) { c.open = true; });
  else if (cards[0]) cards[0].open = true;
  window.addEventListener("beforeprint", function () { document.querySelectorAll("details").forEach(function (d) { d.open = true; }); });

  // --- Estimation
  var levers = [
    { id: "achats", share: 0.25, def: 4, sign: "−" },
    { id: "energie", fixed: 6000, def: 10, sign: "−" },
    { id: "assur", fixed: 2500, def: 10, sign: "−" },
    { id: "banque", share: 0.006, def: 20, sign: "−" },
    { id: "abos", fixed: 5000, def: 10, sign: "−" },
    { id: "ventes", margin: 0.70, def: 3, sign: "+" }
  ];
  var CA_DEFAULT = 400000, FEE = 0.25, YEARS = 6, MULT_LOW = 2.5, MULT_HIGH = 4;
  var caInput = $("ca");
  function update() {
    var ca = Number(caInput.value) || 0, total = 0;
    $("ca-out").textContent = eur.format(ca);
    levers.forEach(function (l) {
      var pct = Number($("r-" + l.id).value) / 100, base, gain;
      if (l.id === "ventes") { base = ca * pct; gain = base * l.margin; }
      else { base = l.fixed != null ? l.fixed : ca * l.share; gain = base * pct; }
      total += gain;
      $("o-" + l.id).textContent = l.sign + Math.round(pct * 100) + " %";
      $("b-" + l.id).textContent = eur.format(round(base));
      $("t-" + l.id).textContent = eur.format(round(gain));
    });
    var six = total * YEARS, fee = total * FEE;
    $("t-total").textContent = eur.format(round(total));
    $("s-total").textContent = eur.format(round(total));
    $("t-six").textContent = eur.format(round(six));
    $("t-fee").textContent = "− " + eur.format(round(fee));
    $("t-keep").textContent = eur.format(round(six - fee));
    $("t-resale").textContent = total > 0
      ? "+" + eur.format(Math.round(total * MULT_LOW / 1000) * 1000) + " à " + eur.format(Math.round(total * MULT_HIGH / 1000) * 1000)
      : eur.format(0);
  }
  $("sim-form").addEventListener("input", update);
  $("sim-form").addEventListener("submit", function (e) { e.preventDefault(); });
  $("reset").addEventListener("click", function () { caInput.value = CA_DEFAULT; levers.forEach(function (l) { $("r-" + l.id).value = l.def; }); update(); });
  update();

  // --- Documents cochés → leviers chiffrables (lettre = domaine, chiffre = levier)
  var TOTAL = 32, BASE = ["v4", "c3", "c4", "t4", "q4"], DOMAINS = ["a", "t", "v", "b", "e", "s", "q", "c"], KEY = "la-royale-documents";
  var boxes = Array.prototype.slice.call(document.querySelectorAll(".doc input"));
  function save() { try { localStorage.setItem(KEY, JSON.stringify(boxes.filter(function (b) { return b.checked; }).map(function (b) { return b.id; }))); } catch (e) {} }
  function load() { try { var ids = JSON.parse(localStorage.getItem(KEY) || "[]"); boxes.forEach(function (b) { b.checked = ids.indexOf(b.id) !== -1; }); } catch (e) {} }
  function cover() {
    var set = {}, docs = 0;
    BASE.forEach(function (l) { set[l] = true; });
    boxes.forEach(function (b) { if (!b.checked) return; docs++; b.getAttribute("data-levers").split(" ").forEach(function (l) { set[l] = true; }); });
    var n = Object.keys(set).length;
    $("cov-n").textContent = n;
    $("cov-fill").style.width = (n / TOTAL * 100).toFixed(1) + "%";
    DOMAINS.forEach(function (d) {
      var k = 0;
      for (var i = 1; i <= 4; i++) if (set[d + i]) k++;
      var row = document.querySelector('#cov-domains [data-dom="' + d + '"]');
      Array.prototype.forEach.call(row.querySelectorAll(".pips i"), function (p, i) { p.classList.toggle("on", i < k); });
      row.querySelector(".pip-count").textContent = k + "/4";
    });
    $("cov-note").textContent = docs === 0
      ? "Sans document : 5 leviers analysables."
      : n < TOTAL ? docs + (docs > 1 ? " documents : " : " document : ") + n + " leviers sur 32 chiffrables."
      : "Les 32 leviers sont chiffrables.";
  }
  boxes.forEach(function (b) { b.addEventListener("change", function () { cover(); save(); }); });
  $("cov-all").addEventListener("click", function () { boxes.forEach(function (b) { b.checked = true; }); cover(); save(); });
  $("cov-reset").addEventListener("click", function () { boxes.forEach(function (b) { b.checked = false; }); cover(); save(); });
  load();
  cover();
}
</script>

<script>
// Écran d'accès : le contenu est chiffré (AES-GCM, clé dérivée du code par PBKDF2) et n'est déchiffré que dans le navigateur.
(function () {
  var gate = document.getElementById("gate"), app = document.getElementById("app");
  var form = document.getElementById("gate-form"), input = document.getElementById("gate-code");
  var btn = document.getElementById("gate-btn"), err = document.getElementById("gate-error");
  var payloadEl = document.getElementById("payload");
  var KEY = "la-royale-acces";

  function show(html) {
    if (html != null) app.innerHTML = html;
    gate.hidden = true;
    app.hidden = false;
    document.body.classList.add("unlocked");
    initApp();
    var target = location.hash && document.getElementById(location.hash.slice(1));
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }
  if (!payloadEl) { show(null); return; } // version de travail non chiffrée

  var normalize = function (c) { return String(c).toUpperCase().replace(/[^A-Z0-9]/g, ""); };
  var b64 = function (s) { return Uint8Array.from(atob(s), function (ch) { return ch.charCodeAt(0); }); };
  async function decrypt(code) {
    var p = JSON.parse(payloadEl.textContent);
    var mat = await crypto.subtle.importKey("raw", new TextEncoder().encode(normalize(code)), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(p.salt), iterations: p.iter, hash: "SHA-256" }, mat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(p.iv) }, key, b64(p.data));
    return new TextDecoder().decode(buf);
  }
  if (!window.crypto || !crypto.subtle) {
    err.textContent = "Ce navigateur ne permet pas d'ouvrir le document. Ouvrez le lien dans Safari ou Chrome, en https.";
    btn.disabled = true;
    return;
  }
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "Ouverture…";
    try {
      var html = await decrypt(input.value);
      try { sessionStorage.setItem(KEY, normalize(input.value)); } catch (x) {}
      show(html);
    } catch (x) {
      err.textContent = "Code incorrect. Vérifiez le code transmis avec le lien.";
      btn.disabled = false;
      btn.textContent = "Ouvrir le document";
      input.select();
    }
  });
  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (x) {}
  if (saved) decrypt(saved).then(show, function () { try { sessionStorage.removeItem(KEY); } catch (x) {} });
  else input.focus();
})();
</script>
